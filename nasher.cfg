[Package]
name = "Ashes of Nyrond"
description = "Ashes of Nyrond Persistent World"
version = "0.1.0"
url = "https://github.com/Kromkar2KromHarder/Unnamed-NWN-Server"
[Sources]
include = "scripts/**/*.nss"
include = "src/**/*.{json,are,gic,git,utp,utc,uti,utd,ute,utm,utt,utw,dlg,itp,gff}"
[Rules]
"*.nss" = "scripts"
"*.utc" = "src/creatures"
"*.uti" = "src/items"
"*.utp" = "src/placeables"
"*.utd" = "src/doors"
"*.uts" = "src/triggers"
"*.utw" = "src/waypoints"
"*.utm" = "src/stores"
"*.ute" = "src/encounters"
"*.utt" = "src/soundobjects"
"*.mdl" = "src/hak_staging"
"*.tga" = "src/hak_staging"
"*.dds" = "src/hak_staging"
"*.plt" = "src/hak_staging"
"*.wav" = "src/hak_staging"
"*.mp3" = "src/hak_staging"
"*.2da" = "src/hak_staging"
"*" = "src"
[Target]
name = "customgiga"
file = "modules/customgiga.mod"
description = "Ashes of Nyrond module"
[Target]
name = "ashes_custom"
file = "hak/ashes_custom.hak"
description = "Ashes of Nyrond custom content hak"
