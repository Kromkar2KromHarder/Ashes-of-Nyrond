name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/Unnamed-NWN-Server
            git pull
            if NWN_ROOT=/home/ryione/nwn_data nasher compile --yes 2>&1; then
              echo "Compile succeeded, restarting server"
              cd docker
              sudo docker compose restart nwn
            else
              echo "Compile failed, aborting deploy"
              exit 1
            fi
